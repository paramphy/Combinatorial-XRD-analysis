
# ==========================================
# COMBINATORIAL XRD CONFIGURATION
# ==========================================

datasets:

  - label: "1 min Sulfurization"
    path: "GI-XRD_Combi_ZnCu_1min"
    color: "#1f77b4"

  - label: "2 min Sulfurization"
    path: "GI-XRD_Combi_ZnCu_2min"
    color: "#ff7f0e"

  - label: "5 min Sulfurization"
    path: "GI-XRD_Combi_ZnCu_5min"
    color: "#2ca02c"

  - label: "10 min Sulfurization"
    path: "GI-XRD_Combi_ZnCu_10min"
    color: "#d62728"


# Measurement order
# Coordinates are in millimetres.

position_order:

  - "phi0(0,-15)"
  - "phi0(0,-7)"
  - "phi0(0,0)"
  - "phi0(0,7)"
  - "phi0(0,15)"

  - "phi90(-15,0)"
  - "phi90(-7,0)"
  - "phi90(0,0)"
  - "phi90(7,0)"
  - "phi90(15,0)"


# Optional custom panel titles

position_labels: {}


# ==========================================
# DATA PROCESSING
# ==========================================

processing:

  normalization: "none"
  # Options: none, max

  subtract_constant_background: 0

  clip_negative_after_background: true


# ==========================================
# PLOTTING SETTINGS
# ==========================================

plot:

  title: "Spatially resolved XRD patterns"

  xlim: [25, 70]

  ncols: 5

  figsize: [18, 9]

  # Vertical separation between conditions
  offset_fraction: 0.5

  line_width: 1.15

  title_size: 9

  tick_size: 8

  label_size: 11

  suptitle_size: 14

  show_legend: true

  hide_y_ticks: true

  grid: false


# ==========================================
# OUTPUT SETTINGS
# ==========================================

output:

  directory: "xrd_output_2"

  filename: "xrd_waterfall_by_position"

  formats:
    - png


  dpi: 600

  save_processed_csv: true


# ==========================================
# COMBINED XRD PLOTS
# ==========================================

combined_plot:

  enabled: true

  save_linear: true

  save_log: true

  figsize: [16, 9]

  line_width: 0.9

  alpha: 0.75

  legend_size: 8

  xlim: [25, 70]

  linear_title: "Combined XRD patterns - Linear scale"

  log_title: "Combined XRD patterns - Logarithmic scale"



# ==========================================
# CONDITION-WISE SPATIAL XRD PLOTS
# ==========================================

condition_grid:

  enabled: true

  filename: "xrd_by_sulfurization_condition"

  title: "Spatial XRD comparison across sulfurization conditions"

  figsize: [16, 12]

  xlim: [25, 70]

  # Common vertical spacing for all four panels
  offset_fraction: 0.5

  line_width: 1.0

  alpha: 0.9

  colormap: "tab10"

  title_size: 12

  tick_size: 9

  label_size: 12

  suptitle_size: 15

  legend_size: 8

  hide_y_ticks: true

  grid: false

condition_grid:

  enabled: true

  filename: "xrd_by_sulfurization_condition"

  figsize: [16, 12]

  xlim: [25, 70]

  offset_fraction: 0.5

  line_width: 1.0

  alpha: 0.9

  colormap: "tab10"

  hide_y_ticks: false


# ==========================================
# THEORETICAL XRD REFERENCE PATTERNS
# ==========================================

# ============================================================

reference_patterns:
  enabled: true
  # Supported: cif or rtf
  source: "rtf"

  # Reference phase definitions
  phases:

    CuS:
      file: "reference/CuS_ICDD-04-008-8460.rtf"
      color: "#2685D8"

    ZnS:
      file: "reference/ZnS_00-074-1063.rtf"
      color: "#D84A4A"

  display:
    display:
    show: true

    # Separate reference-panel layout
    panel_row_height: 0.28
    panel_padding: 0.08

    # Reference stick appearance
    panel_line_width: 1.3
    panel_alpha: 0.95

    # Labels and ticks
    panel_label_size: 8
    panel_tick_size: 5
    panel_ylabel_size: 8

    # Use the figure-level xlabel for multi-panel figures.
    panel_xlabel: true

    # Existing reference-display settings
    max_peaks: 50
    max_hkl_labels: 0
    label_size: 6

normalized_waterfall:
  enabled: true
  filename: "xrd_waterfall_normalized"
  save_csv: true

plot:
  normalized_offset_fraction: 0.5
  normalized_title: "Spatially resolved XRD patterns (normalized)"


peak_detection:
  enabled: true

  # Savitzky-Golay smoothing
  smoothing_enabled: true
  window_length: 111
  polyorder: 3

  # Prominence-based detection
  prominence_fraction: 0.08
  minimum_prominence: 0.05
  min_distance_points: 1

  # Diagnostic measurements
  local_noise_window_points: 21

  # Output
  filename: "experimental_detected_peaks.csv"


  peak_classification:
  enabled: true

  filename: "experimental_peak_classification.csv"

  # Maximum allowed difference between experimental
  # and theoretical peak positions.
  match_tolerance_deg: 1.0

  # Use every calculated theoretical reflection by default.
  # For example, 0.02 excludes reference peaks below
  # 2% of the strongest theoretical intensity.
  minimum_reference_intensity_fraction: 1.0

  # Diagnostic plots
  plot_representative_pattern: true

  # Choose one pattern for initial visual validation.
  selected_condition: "Sulfurization 4"
  selected_position: "phi0(0,0)"